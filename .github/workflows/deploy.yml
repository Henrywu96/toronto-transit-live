# Vercel builds and deploys the site on every push to main by itself (Vercel's GitHub integration).
# This workflow only asks Vercel to rebuild once a day, so the timetables (downloaded fresh on every
# Vercel build) stay current even on days without a push. It needs the VERCEL_DEPLOY_HOOK_URL secret.
name: Daily Vercel rebuild

on:
  schedule:
    - cron: '17 8 * * *' # every day, about 3–4 am in Toronto
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel rebuild
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_HOOK" ]; then echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set – skipping"; exit 0; fi
          curl --fail --show-error --silent --request POST "$VERCEL_HOOK"
